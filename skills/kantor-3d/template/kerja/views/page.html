<style>
:root {
  --bg: #efeae3;
  --panel: rgba(255, 255, 255, .9);
  --panel-solid: #ffffff;
  --line: #e6dfd5;
  --line-strong: #d6cdc0;
  --text: #2b2a28;
  --muted: #6f6a62;
  --faint: #9a938a;
  --pingot: #3f6fd1;
  --zaki: #2f9a6d;
  --lulu: #d9772f;
  --risko: #7a5cc4;
  --ok: #2f9a6d;
  --warn: #c98a00;
  --bad: #d64545;
  --radius: 14px;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
#scene { position: fixed; inset: 0; }
#scene canvas { display: block; }
.labels { position: fixed; inset: 0; pointer-events: none; }
button { font: inherit; color: inherit; }
.card-ui { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 6px 24px rgba(60, 45, 25, .08); }

/* bar atas */
.top { position: fixed; top: 14px; left: 16px; right: 16px; display: flex; gap: 12px; align-items: stretch; pointer-events: none; z-index: 5; }
.top > * { pointer-events: auto; }
.brand { padding: 10px 16px; display: flex; flex-direction: column; justify-content: center; min-width: 0; max-width: 46vw; }
.brand h1 { margin: 0; font-size: 15px; font-weight: 700; white-space: nowrap; }
.brand h1 span { color: var(--muted); font-weight: 500; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress { flex: 1; padding: 10px 16px; display: flex; flex-direction: column; justify-content: center; gap: 7px; min-width: 180px; }
.progress .row { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--muted); }
.progress .row b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.bar { height: 7px; border-radius: 99px; background: #eee7dc; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--zaki); transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
.stats { display: flex; padding: 0; overflow: hidden; }
.stat { padding: 9px 16px; display: flex; flex-direction: column; justify-content: center; border-left: 1px solid var(--line); }
.stat:first-child { border-left: 0; }
.stat small { color: var(--muted); font-size: 11px; white-space: nowrap; }
.stat b { font: 600 16px/1.2 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.live { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; animation: blink 2s infinite; }
.dot.off { background: var(--bad); animation: none; }
@keyframes blink { 50% { opacity: .35; } }

.banner { position: fixed; top: 84px; left: 50%; transform: translateX(-50%); z-index: 6; padding: 8px 16px; border-radius: 99px; font-weight: 600; font-size: 12.5px; display: none; align-items: center; gap: 8px; max-width: calc(100vw - 32px); box-shadow: 0 6px 20px rgba(60,45,25,.12); }
.banner.show { display: flex; }
.banner.warn { background: #fff4d6; border: 1px solid #f0d58a; color: #7a5800; }
.banner.bad { background: #fde6e6; border: 1px solid #f1b3b3; color: #8f2323; }

/* panel samping */
.side { position: fixed; top: 84px; bottom: 150px; width: 312px; display: flex; flex-direction: column; overflow: hidden; z-index: 4; }
.side.left { left: 16px; }
.side.right { right: 16px; width: 344px; }
.side header { padding: 12px 14px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); }
.side header h2 { margin: 0; font-size: 12.5px; font-weight: 700; }
.scroll { overflow-y: auto; flex: 1; scrollbar-width: thin; scrollbar-color: #d6cdc0 transparent; }
.feed { list-style: none; margin: 0; padding: 6px 0; }
.feed li { display: grid; grid-template-columns: 30px 1fr; gap: 9px; padding: 7px 14px; }
.feed li.fresh { animation: in .6s ease both; background: #fbf6ec; }
.feed .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 12px; }
.feed .meta { display: flex; gap: 6px; align-items: baseline; }
.feed .who { font-weight: 700; font-size: 12px; }
.feed time { font: 11px var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; }
.feed .txt { color: #3d3a36; word-break: break-word; }
.feed li.k-text .txt { color: var(--muted); font-style: italic; }
@keyframes in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.tabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: 1 0 auto; background: none; border: 0; padding: 9px 4px; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--text); }
.tabs button .n { display: inline-block; min-width: 17px; padding: 0 5px; margin-left: 4px; border-radius: 99px; background: #eee7dc; font-size: 10.5px; line-height: 16px; color: var(--muted); }
.tabs button .n.hot { background: #f5c542; color: #3b2c00; }
.pane { display: none; padding: 10px 12px 14px; }
.pane.on { display: block; }
.empty { color: var(--faint); padding: 18px 6px; text-align: center; font-size: 12.5px; }
h3.sub { margin: 14px 2px 8px; font-size: 11.5px; color: var(--muted); font-weight: 700; }

.mod { padding: 8px; border-radius: 10px; }
.mod:hover { background: #faf6ef; }
.mod .h { display: flex; align-items: baseline; gap: 8px; }
.mod .id { font: 600 11px var(--mono); color: var(--faint); flex: none; }
.mod .nm { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mod .pc { font: 600 12px var(--mono); font-variant-numeric: tabular-nums; }
.mod .bar { margin-top: 6px; height: 5px; }
.mod .meta { margin-top: 5px; display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 99px; font-size: 10.5px; font-weight: 600; border: 1px solid var(--line-strong); color: var(--muted); white-space: nowrap; background: #fff; }
.chip i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.phases { list-style: none; margin: 4px 0 10px; padding: 0 2px; }
.phases li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 5px 6px; border-left: 2px solid var(--line-strong); margin-left: 10px; }
.phases .pn { width: 20px; height: 20px; margin-left: -18px; border-radius: 50%; display: grid; place-items: center; font: 600 10.5px var(--mono); background: #fff; border: 1px solid var(--line-strong); color: var(--muted); }
.phases b { display: block; font-weight: 600; font-size: 12px; } .phases small { color: var(--faint); font: 10.5px var(--mono); }
.phases .pp { font: 600 11px var(--mono); color: var(--muted); }
.phases li.active { border-left-color: var(--zaki); } .phases li.active .pn { border-color: var(--zaki); color: var(--zaki); }
.phases li.done { border-left-color: var(--ok); } .phases li.done .pn { background: var(--ok); color: #fff; border-color: var(--ok); }

.q { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; background: #fff; }
.q.pending { border-color: #f0d58a; background: #fffaeb; }
.q .h { display: flex; gap: 8px; align-items: baseline; }
.q .qid { font: 700 11px var(--mono); color: var(--warn); }
.q.done .qid { color: var(--ok); }
.q .t { font-weight: 600; flex: 1; }
.q .rec { margin-top: 6px; color: var(--muted); font-size: 12px; }

.doc { width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 10px; border-radius: 10px; background: none; border: 0; cursor: pointer; }
.doc:hover { background: #faf6ef; }
.doc b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc small { color: var(--faint); font: 11px var(--mono); grid-column: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc time { color: var(--faint); font-size: 11px; grid-row: 1; grid-column: 2; }
.doc .verdict { grid-column: 2; grid-row: 2; justify-self: end; }

.gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.gallery button { padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; cursor: zoom-in; text-align: left; }
.gallery img { display: block; width: 100%; aspect-ratio: 16/10; object-fit: cover; object-position: top; }
.gallery span { display: block; padding: 5px 8px; font: 10.5px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* kartu karyawan */
.cards { position: fixed; left: 16px; right: 16px; bottom: 14px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; z-index: 5; }
.card { padding: 11px 14px 12px; cursor: pointer; transition: transform .25s, box-shadow .25s; min-width: 0; text-align: left; display: grid; grid-template-columns: 40px 1fr; gap: 3px 11px; }
.card:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(60,45,25,.14); }
.card .ava { grid-row: 1 / span 3; width: 40px; height: 40px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 16px; position: relative; }
.card.working .ava::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; background: #2fbf71; border: 2px solid #fff; }
.card .h { display: flex; align-items: center; gap: 8px; min-width: 0; }
.card .nm { font-weight: 700; font-size: 13.5px; }
.card .role { color: var(--muted); font-size: 12px; }
.card .st { margin-left: auto; }
.card .task { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .act { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .nums { grid-column: 2; margin-top: 3px; display: flex; gap: 12px; font: 11px var(--mono); color: var(--faint); }
.cards.compact { gap: 8px; }
.card.more { cursor: default; --c: #9a938a; }
.card.more:hover { transform: none; }
.card.more .ava { font-size: 14px; }
.card .dotc { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 4px 1px 0; vertical-align: middle; }
.cards.compact .card.more .act { display: none; }
/* papan cadangan (tanpa planning/): sumber data selalu ditulis */
.src { margin: 2px 2px 10px; font-size: 11.5px; color: var(--muted); }
.row { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: baseline; padding: 6px 8px; border-radius: 8px; }
.row:hover { background: #faf6ef; }
.row code { font: 600 11px var(--mono); color: #9a7418; }
.row .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.row time { color: var(--faint); font-size: 11px; white-space: nowrap; }
.todo { display: grid; grid-template-columns: 18px 1fr; gap: 6px; padding: 4px 8px; font-size: 12.5px; }
.todo i { font-style: normal; color: var(--faint); }
.todo.s-in_progress i { color: var(--ok); }
.todo.s-completed span { color: var(--faint); text-decoration: line-through; }
.cards.compact .card { padding: 9px 10px 10px; grid-template-columns: 32px 1fr; gap: 2px 8px; }
.cards.compact .card .ava { width: 32px; height: 32px; font-size: 13px; }
.cards.compact .card .role, .cards.compact .card .nums { display: none; }
.cards.compact .card .st { font-size: 10px; padding: 1px 6px; }
/* 7–8 kartu: nama tidak dua baris, status turun ke baris berikutnya bila tidak muat */
.cards.compact .card .h { flex-wrap: wrap; row-gap: 2px; }
.cards.compact .card .nm { min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cards.compact .card .st { margin-left: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }

/* label 3D: nama + gelembung ucapan */
.person { transform: translateY(-4px); text-align: center; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.bubble { max-width: 230px; padding: 6px 10px; border-radius: 12px; background: #fff; color: #2b2a28; font-size: 11.5px; line-height: 1.35; box-shadow: 0 4px 14px rgba(60,45,25,.18); position: relative; border: 1px solid #eadfce; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 10px; height: 10px; background: #fff; border-right: 1px solid #eadfce; border-bottom: 1px solid #eadfce; transform: translateX(-50%) rotate(45deg); }
.bubble.hide { display: none; }
.bubble.warn { background: #fff4d6; border-color: #f0d58a; } .bubble.warn::after { background: #fff4d6; border-color: #f0d58a; }
.bubble.sleep { background: #eef0f6; color: #5b6275; font-style: italic; } .bubble.sleep::after { background: #eef0f6; }
.tag { padding: 2px 9px; border-radius: 99px; font-size: 11px; font-weight: 700; color: #fff; background: var(--c); box-shadow: 0 2px 8px rgba(0,0,0,.18); white-space: nowrap; }
.tag small { font-weight: 500; opacity: .85; }

dialog { border: 1px solid var(--line-strong); border-radius: 16px; background: var(--panel-solid); color: var(--text); padding: 0; width: min(920px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: 0 30px 80px rgba(40,30,15,.3); }
dialog::backdrop { background: rgba(40,32,20,.35); backdrop-filter: blur(3px); }
dialog header { position: sticky; top: 0; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel-solid); z-index: 1; }
dialog header b { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 12.5px; }
dialog header button { background: #f5f0e8; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
.md { padding: 8px 22px 22px; overflow-wrap: anywhere; }
.md h1 { font-size: 20px; } .md h2 { font-size: 16px; margin-top: 22px; border-bottom: 1px solid var(--line); padding-bottom: 6px; } .md h3 { font-size: 14px; }
.md table { border-collapse: collapse; width: 100%; font-size: 12px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
.md th { background: #faf6ef; }
.md code { font-family: var(--mono); font-size: 12px; background: #f3eee6; padding: 1px 5px; border-radius: 5px; }
.md pre { background: #faf7f2; border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md a { color: var(--pingot); }
.md blockquote { margin: 8px 0; padding: 6px 12px; border-left: 3px solid var(--ok); background: #f1f8f4; }
.lightbox img { display: block; max-width: 100%; height: auto; }

.loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 20; background: var(--bg); transition: opacity .8s; }
.loading.gone { opacity: 0; pointer-events: none; }
.loading div { text-align: center; color: var(--muted); font-size: 13px; }
.loading i { display: block; width: 160px; height: 3px; margin: 12px auto 0; border-radius: 99px; background: linear-gradient(90deg, transparent, var(--zaki), transparent); background-size: 50% 100%; background-repeat: no-repeat; animation: load 1.2s linear infinite; }
@keyframes load { from { background-position: -100% 0; } to { background-position: 200% 0; } }

.toggle { padding: 0 14px; border: 1px solid var(--line); cursor: pointer; font-weight: 600; font-size: 12px; color: var(--text); white-space: nowrap; }
.toggle:hover { background: #fff; }
body.lapang .side { display: none; }
body.lapang .cards { opacity: .92; }
/* panel bisa diperkecil (desktop & ponsel) */
.tabrow { display: flex; align-items: center; border-bottom: 1px solid var(--line); }
.tabrow .tabs { flex: 1; min-width: 0; border-bottom: 0; }
.tabrow .minbtn { margin: 4px 8px 0 4px; }
.side.min .tabrow { border-bottom: 0; }
.minbtn { flex: none; display: grid; place-items: center; width: 32px; height: 30px; margin: 0 0 4px 4px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; font-size: 14px; line-height: 1; color: var(--muted); transition: transform .2s; }
.minbtn:hover { color: var(--text); border-color: var(--line-strong); }
.side header .hright { display: flex; align-items: center; gap: 6px; }
.side header .minbtn { margin: 0; }
.side.min { bottom: auto !important; height: auto !important; }
.side.min .scroll { display: none; }
.side.min .tabs { border-bottom: 0; }
.side.min .tabs button[aria-selected="true"] { border-bottom-color: transparent; }
.side.min header { border-bottom: 0; }
.side.min .minbtn { transform: rotate(180deg); }
@media (max-width: 1180px) {
  .side.left { display: none; }
  .stats .stat:nth-child(n+3) { display: none; }
}
@media (max-width: 820px) {
  .top { flex-wrap: wrap; top: 10px; left: 10px; right: 10px; gap: 8px; }
  .brand { flex: 1 1 100%; max-width: none; }
  .brand p { white-space: normal; }
  .progress { flex: 1 1 60%; }
  .stats { flex: 1 1 30%; }
  .stats .stat:nth-child(n+2) { display: none; }
  .toggle { display: none; }
  .banner { top: auto; bottom: 46vh; }
  .side.right { top: auto; left: 10px; right: 10px; width: auto; bottom: 10px; height: 38vh; }
  .side.right.min { top: auto; bottom: 10px !important; }
  body.min-right .cards { bottom: 70px; }
  body.min-right .banner { bottom: 132px; }
  /* ponsel: info lebih transparan supaya kantor tetap terlihat */
  .card-ui { background: rgba(255, 255, 255, .58); backdrop-filter: blur(6px) saturate(120%); -webkit-backdrop-filter: blur(6px) saturate(120%); box-shadow: 0 4px 16px rgba(60, 45, 25, .08); }
  .side.right .scroll { background: rgba(255, 255, 255, .25); }
  .card .ava { width: 34px; height: 34px; font-size: 14px; }
  .cards { bottom: calc(38vh + 18px); left: 0; right: 0; display: flex; overflow-x: auto; gap: 8px; padding: 0 10px; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .cards::-webkit-scrollbar { display: none; }
  .card { flex: 0 0 70%; scroll-snap-align: start; padding: 8px 10px; }
  .card .nums { display: none; }
  .bubble { max-width: 150px; font-size: 10.5px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<body>
<div class="loading" id="loading"><div>Menyiapkan kantor…<i></i></div></div>
<div id="scene"></div>
<div class="labels" id="labels"></div>

<div class="top">
  <div class="brand card-ui">
    <h1>Ruang Kerja Tim <span>· {{PROJECT}}</span></h1>
    <p id="phase">Memuat…</p>
  </div>
  <div class="progress card-ui">
    <div class="row"><span class="live"><i class="dot" id="liveDot"></i><span id="liveTxt">Menghubungkan…</span></span><span><span id="pctLabel">Progres roadmap</span> <b id="pct">0%</b></span></div>
    <div class="bar"><i id="pctBar"></i></div>
  </div>
  <div class="stats card-ui">
    <div class="stat"><small id="sPlansLabel">Plan selesai</small><b id="sPlans">–</b></div>
    <div class="stat"><small>Aksi tim</small><b id="sTools">–</b></div>
    <div class="stat"><small>Token diproses</small><b id="sTok">–</b></div>
    <div class="stat"><small>Sesi kerja</small><b id="sRuns">–</b></div>
  </div>
  <button class="toggle card-ui" id="togglePanel" type="button" title="Tombol pintas: H">Lihat kantor penuh</button>
</div>

<div class="banner" id="banner" role="status"></div>

<aside class="side left card-ui" aria-label="Aktivitas langsung">
  <header><h2>Aktivitas langsung</h2><span class="hright"><span class="chip" id="feedCount">0</span><button type="button" class="minbtn" data-min="left" aria-expanded="true" title="Perkecil / buka panel"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></span></header>
  <div class="scroll"><ul class="feed" id="feed"></ul></div>
</aside>

<aside class="side right card-ui" aria-label="Detail pekerjaan">
  <div class="tabrow"><div class="tabs" role="tablist">
    <button role="tab" data-tab="roadmap" aria-selected="true"><span class="tl">Roadmap</span></button>
    <button role="tab" data-tab="keputusan" aria-selected="false"><span class="tl">Keputusan</span><span class="n" id="nQ">0</span></button>
    <button role="tab" data-tab="output" aria-selected="false"><span class="tl">Output</span><span class="n" id="nDocs">0</span></button>
    <button role="tab" data-tab="bukti" aria-selected="false"><span class="tl">Bukti QA</span><span class="n" id="nEv">0</span></button>
    <button role="tab" data-tab="feed2" aria-selected="false" class="mfeed" hidden><span class="tl">Aktivitas</span></button>
  </div><button type="button" class="minbtn" data-min="right" aria-expanded="true" title="Perkecil / buka panel"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
  <div class="scroll">
    <section class="pane on" data-pane="roadmap" id="paneRoadmap"></section>
    <section class="pane" data-pane="keputusan" id="paneQ"></section>
    <section class="pane" data-pane="output" id="paneDocs"></section>
    <section class="pane" data-pane="bukti" id="paneEv"></section>
    <section class="pane" data-pane="feed2"><ul class="feed" id="feed2"></ul></section>
  </div>
</aside>

<div class="cards" id="cards"></div>

<dialog id="reader"><header><b id="readerTitle"></b><button id="readerClose" type="button">Tutup</button></header><div class="md" id="readerBody"></div></dialog>
<dialog id="lightbox" class="lightbox"><header><b id="lbTitle"></b><button id="lbClose" type="button">Tutup</button></header><img id="lbImg" alt=""></dialog>

{{CONFIG_SCRIPT}}
<script type="module" src="/kerja/assets/kantor.js?v=21"></script>
</body>
</html>
